<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>bak · 创建备份</title>
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ui/styles.css" />
    <script src="/ui/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到主要内容</a>
    <aside class="sidebar">
      <a class="brand" href="#backup" aria-label="bak 首页"
        ><span class="brand-mark" aria-hidden="true">b</span><span>bak</span></a
      >
      <nav aria-label="主导航">
        <a href="#backup" aria-current="page">创建备份</a>
        <a href="#repository">备份仓库</a>
        <a href="#jobs">任务记录</a>
      </nav>
      <section class="connection-panel" aria-label="服务连接">
        <div class="connection-status" role="status">
          <span
            id="connection-dot"
            class="status-indicator muted"
            aria-hidden="true"
          ></span
          ><span id="connection-state">未连接</span><span id="version"></span>
        </div>
        <p id="connection-host" class="connection-host"></p>
        <button id="open-connection" class="secondary" type="button">
          连接服务
        </button>
        <button id="disconnect-button" class="secondary" type="button" hidden>
          断开连接
        </button>
      </section>
    </aside>

    <main id="main" tabindex="-1">
      <section id="backup" class="view" aria-labelledby="backup-title">
        <h1 id="backup-title" tabindex="-1">创建备份</h1>
        <form id="backup-form" class="panel">
          <p class="section-description">
            路径均属于运行 bak 的设备，相对路径基于服务工作目录。
          </p>
          <fieldset data-connected disabled>
            <div class="form-grid">
              <div>
                <label for="source">源目录</label
                ><input
                  id="source"
                  name="source"
                  placeholder="/Users/me/Documents"
                  aria-describedby="source-help"
                  required
                />
                <p id="source-help" class="field-help">
                  目录需已存在。备份期间请保持文件不变。
                </p>
              </div>
              <div>
                <label for="backup-repository">备份仓库</label
                ><input
                  id="backup-repository"
                  name="repository"
                  placeholder="/Volumes/Backup/repository"
                  aria-describedby="backup-repository-help"
                  required
                />
                <p id="backup-repository-help" class="field-help">
                  目录需已存在，且不能与源目录相互包含。
                </p>
              </div>
            </div>
            <div class="form-actions">
              <button id="backup-button" type="submit">创建备份</button>
            </div>
          </fieldset>
          <p id="backup-message" class="message" role="status"></p>
          <a id="backup-job-link" class="action-link" href="#jobs" hidden
            >查看任务</a
          >
        </form>
      </section>

      <section
        id="repository"
        class="view"
        aria-labelledby="repository-title"
        hidden
      >
        <div class="view-heading">
          <h1 id="repository-title" tabindex="-1">备份仓库</h1>
          <span id="repository-label" class="view-meta">尚未载入仓库</span>
        </div>
        <div class="panel">
          <form id="repository-form">
            <fieldset class="inline-form" data-connected disabled>
              <div class="grow">
                <label for="repository-path">仓库路径</label
                ><input
                  id="repository-path"
                  name="repository"
                  placeholder="输入已有仓库的路径"
                  aria-describedby="repository-help"
                  required
                />
              </div>
              <button id="repository-button" class="secondary" type="submit">
                载入备份
              </button>
            </fieldset>
            <p id="repository-help" class="field-help">
              输入服务端目录路径，选择备份后可恢复到独立的空目录。
            </p>
          </form>
          <p id="repository-message" class="message" role="status"></p>
          <div id="backup-list" class="backup-list">
            <div class="empty-state"><p>尚未载入仓库。</p></div>
          </div>
        </div>
      </section>

      <section id="jobs" class="view" aria-labelledby="jobs-title" hidden>
        <div class="view-heading">
          <h1 id="jobs-title" tabindex="-1">任务记录</h1>
          <button id="refresh-jobs" class="secondary" type="button" disabled>
            刷新
          </button>
        </div>
        <div class="panel">
          <p id="jobs-updated" class="view-meta">连接后自动更新任务状态。</p>
          <p id="jobs-message" class="message" role="status"></p>
          <div id="job-list">
            <div class="empty-state"><p>尚未连接服务。</p></div>
          </div>
          <div class="pagination">
            <button id="previous-jobs" class="secondary" type="button" disabled>
              较新记录</button
            ><span id="jobs-page">第 1 页</span
            ><button id="next-jobs" class="secondary" type="button" disabled>
              较早记录
            </button>
          </div>
        </div>
      </section>
      <noscript
        ><p class="message error">请启用 JavaScript 以使用控制台。</p></noscript
      >
    </main>

    <dialog id="connection-dialog" aria-labelledby="connection-title">
      <form id="connect-form">
        <div class="dialog-heading">
          <h2 id="connection-title">连接服务</h2>
          <button
            id="close-connection"
            class="icon-button"
            type="button"
            aria-label="关闭连接窗口"
          >
            ×
          </button>
        </div>
        <label for="secret">访问密钥</label
        ><input
          id="secret"
          name="secret"
          type="password"
          autocomplete="off"
          aria-describedby="secret-help"
          required
        />
        <p id="secret-help" class="field-help">
          密钥仅保留在页面内存中，刷新后需要重新输入。
        </p>
        <p id="connection-message" class="message" role="status"></p>
        <div class="dialog-actions">
          <button id="connect-button" type="submit">连接</button>
        </div>
      </form>
    </dialog>

    <dialog id="restore-dialog" aria-labelledby="restore-title">
      <form id="restore-form">
        <div class="dialog-heading">
          <h2 id="restore-title">恢复备份</h2>
          <button
            id="close-restore"
            class="icon-button"
            type="button"
            aria-label="关闭恢复窗口"
          >
            ×
          </button>
        </div>
        <dl class="restore-summary">
          <dt>备份编号</dt>
          <dd id="restore-id"></dd>
          <dt>仓库</dt>
          <dd id="restore-repository"></dd>
        </dl>
        <label for="destination">恢复目标目录</label
        ><input
          id="destination"
          name="destination"
          placeholder="/Users/me/Restored"
          aria-describedby="destination-help"
          required
        />
        <p id="destination-help" class="field-help">
          必须是已存在的空目录，且不能与仓库相互包含。失败或中断可能留下部分恢复文件。
        </p>
        <p id="restore-message" class="message" role="status"></p>
        <div class="dialog-actions">
          <button id="cancel-restore" class="secondary" type="button">
            取消</button
          ><button id="restore-button" type="submit">开始恢复</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
