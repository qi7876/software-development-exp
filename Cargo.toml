[package]
name = "bak"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = "4.6.7"
http = "1.5.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
