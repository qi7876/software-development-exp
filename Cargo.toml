[workspace]
members = [
    "crates/backup-cli",
    "crates/backup-core",
    "crates/backup-daemon",
    "crates/backup-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
