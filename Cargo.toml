[package]
name = "bak"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dependencies]
clap = "4.6.7"
http = "1.5.0"
percent-encoding = "2.3.2"
rouille = { version = "3.6.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4"] }
