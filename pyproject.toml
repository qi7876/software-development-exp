[project]
name = "data-backup-doc-tools"
version = "0.1.0"
description = "Documentation tooling for the Data Backup project"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.3.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.3",
    "ruff>=0.12.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # 中文报告正文需要使用全角标点

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["scripts"]
