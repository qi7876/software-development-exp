[project]
name = "data-backup-doc-tools"
version = "0.1.0"
description = "Documentation tooling for the Data Backup project"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # 中文报告正文需要使用全角标点

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["scripts"]
