      "notes": "手动和计划执行使用同一备份流程。",
      "basic_flow": [
        {"id": "B1", "actor": "USR/OS", "action": "触发任务执行。"},
        {"id": "B2", "actor": "系统", "action": "创建运行记录并锁定任务写操作。"},
        {"id": "B3", "actor": "系统", "action": "检查源、目标、仓库版本和可用空间。"},
        {"id": "B4", "actor": "系统", "action": "执行 UC-12，得到本次包含的文件集合。"},
        {"id": "B5", "actor": "系统", "action": "执行 UC-13，写入并提交快照。"},
        {"id": "B6", "actor": "系统", "action": "保存统计和运行结果，释放任务锁并通知用户。"}
