      "alternative_flows": [
        {"id": "A1", "from": "B4", "condition": "没有新增或变化内容", "steps": ["系统记录无变化结果；按策略创建轻量快照或结束运行。", "流程继续到 B6。"]},
        {"id": "A2", "from": "B3", "condition": "远程目标暂时不可用", "steps": ["系统执行有界重试。", "目标恢复后返回 B3。"]}
      ],
