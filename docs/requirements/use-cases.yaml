        {"id": "E1", "from": "B3-B5", "condition": "空间不足、权限失败或目标持续离线", "steps": ["系统停止写入并清理未提交数据。", "运行标记为失败并记录可操作原因。"]},
        {"id": "E2", "from": "B2-B5", "condition": "用户取消运行", "steps": ["转入 UC-16。"]}
      ]
