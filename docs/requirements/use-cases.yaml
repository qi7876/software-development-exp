    {
      "id": "UC-01", "name": "管理备份任务", "kind": "main", "priority": "Must",
      "goal": "用户创建或修改可由系统执行的备份任务，并安全地启停或删除任务。",
      "primary_actor": "USR", "supporting_actors": ["SRC", "TGT"],
      "trigger": "用户选择新建任务，或打开已有任务进行管理。",
      "preconditions": ["应用已安装且后台服务可用。", "用户对所选源和目标具有必要访问权限。"],
      "success": "任务配置通过验证并持久化，守护进程加载最新版本。",
      "failure": "无效配置未被启用，原有任务和已有备份数据保持不变。",
      "includes": ["UC-09", "UC-10", "UC-11"],
      "extension_points": [], "extends": null, "parent": null,
      "requirements": ["FR-01", "FR-02", "FR-03", "FR-10", "FR-14", "FR-15", "FR-16"],
      "nfr": ["NFR-03", "NFR-05", "NFR-07"],
      "business_rules": ["删除任务与删除备份数据是两个独立动作。", "危险路径嵌套必须阻止保存。"],
      "notes": "新建和编辑共享同一配置流程；启停和删除作为任务管理的备选流程。",
      "basic_flow": [
        {"id": "B1", "actor": "USR", "action": "选择新建任务或打开已有任务。"},
        {"id": "B2", "actor": "系统", "action": "显示名称、源、目标、计划、保留和当前配置。"},
        {"id": "B3", "actor": "USR", "action": "填写或修改基本配置。"},
        {"id": "B4", "actor": "系统", "action": "执行 UC-09 和 UC-10，收集数据保护与筛选配置。"},
        {"id": "B5", "actor": "USR", "action": "确认配置摘要并保存。"},
        {"id": "B6", "actor": "系统", "action": "执行 UC-11；验证成功后持久化配置并通知守护进程。"}
      ],
      "alternative_flows": [
        {"id": "A1", "from": "B1", "condition": "用户选择启用或停用任务", "steps": ["系统更新启用状态和下一次运行时间，不修改快照数据。"]},
        {"id": "A2", "from": "B1", "condition": "用户选择删除任务", "steps": ["系统分别确认任务配置和备份数据的处理方式。", "用户确认后系统删除配置；备份数据默认保留。"]}
      ],
      "exception_flows": [
        {"id": "E1", "from": "B6", "condition": "配置验证失败", "steps": ["系统定位错误字段并拒绝启用新配置。", "用户修改后返回 B5。"]}
      ]
    },
    {
