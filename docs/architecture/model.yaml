    {
      "id": "context",
      "kind": "component",
      "view": "system-context",
      "title": "数据备份系统上下文图",
      "purpose": "该图界定数据备份系统与使用者及外部系统的边界。桌面用户负责配置、查看和恢复，自动化用户与操作系统调度器可触发任务，系统从源文件系统读取数据并写入本地或远程备份存储。",
      "direction": "left to right",
      "packages": ["系统边界"],
      "elements": [
        {"id": "DesktopUser", "name": "桌面用户", "type": "actor", "package": "", "stereotype": "person"},
        {"id": "AutomationUser", "name": "高级与自动化用户", "type": "actor", "package": "", "stereotype": "person"},
        {"id": "BackupSystem", "name": "数据备份系统", "type": "component", "package": "系统边界", "stereotype": "software system"},
        {"id": "OSScheduler", "name": "操作系统调度器", "type": "component", "package": "", "stereotype": "external system"},
        {"id": "SourceFS", "name": "源文件系统", "type": "folder", "package": "", "stereotype": "external system"},
        {"id": "LocalStore", "name": "本地备份存储", "type": "folder", "package": "", "stereotype": "external system"},
        {"id": "RemoteStore", "name": "WebDAV / S3 远程存储", "type": "cloud", "package": "", "stereotype": "external system"}
      ],
      "relations": [
        {"source": "DesktopUser", "target": "BackupSystem", "label": "配置、监控、浏览和恢复", "direction": "right", "style": "solid"},
        {"source": "AutomationUser", "target": "BackupSystem", "label": "通过 CLI 自动化", "direction": "right", "style": "solid"},
        {"source": "OSScheduler", "target": "BackupSystem", "label": "触发计划任务", "direction": "right", "style": "solid"},
        {"source": "BackupSystem", "target": "SourceFS", "label": "读取文件和元数据", "direction": "right", "style": "solid"},
        {"source": "BackupSystem", "target": "LocalStore", "label": "读写备份仓库", "direction": "right", "style": "solid"},
        {"source": "BackupSystem", "target": "RemoteStore", "label": "通过 HTTPS 读写仓库", "direction": "right", "style": "solid"}
      ],
      "responsibilities": [
        {"element": "数据备份系统", "responsibility": "配置并执行备份、维护快照、校验仓库以及安全恢复数据。"},
        {"element": "桌面用户", "responsibility": "完成交互式任务配置、状态查看、快照浏览和恢复。"},
        {"element": "高级与自动化用户", "responsibility": "通过 CLI 调用与桌面端一致的能力。"},
        {"element": "外部系统", "responsibility": "提供计划触发、源数据及本地或远程持久化能力。"}
      ],
      "details": [
        "系统拥有备份流程和元数据，源文件系统与备份存储位于信任边界之外。",
        "本地存储与 WebDAV/S3 均是备份仓库目标，但远程目标还需处理网络故障和能力差异。",
        "自动化用户是桌面用户能力的命令行表达，不获得绕过校验或安全约束的特权。"
      ],
      "constraints": [
        "所有外部错误必须保留明确语义并呈现给调用者。",
        "用户口令、明文主密钥和用户文件内容不得进入日志或诊断信息。",
        "失败或取消的运行不得暴露为可恢复快照。"
      ],
      "trace": {
