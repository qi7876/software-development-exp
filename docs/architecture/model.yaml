      }
    },
    {
      "id": "component-overview",
      "kind": "component",
      "view": "container",
      "title": "数据备份系统容器图",
      "purpose": "该图从进程和外部系统边界说明桌面端、命令行、后台服务、备份核心及存储设施的协作方式。GUI 与 CLI 均通过同一版本化本地接口访问后台服务，核心逻辑不依赖具体交互端。",
      "direction": "top to bottom",
      "packages": ["客户端", "后台服务", "备份核心", "外部设施"],
      "elements": [
        {"id": "GUI", "name": "桌面 GUI", "type": "component", "package": "客户端", "stereotype": "Svelte 客户端"},
        {"id": "CLI", "name": "命令行 CLI", "type": "component", "package": "客户端", "stereotype": "自动化入口"},
        {"id": "API", "name": "版本化本地接口", "type": "interface", "package": "后台服务", "stereotype": "逻辑接口"},
        {"id": "Daemon", "name": "后台守护进程", "type": "component", "package": "后台服务", "stereotype": "进程"},
        {"id": "Scheduler", "name": "任务调度与运行管理", "type": "component", "package": "后台服务", "stereotype": "应用服务"},
        {"id": "CoreAPI", "name": "备份核心接口", "type": "interface", "package": "备份核心", "stereotype": "端口"},
        {"id": "Core", "name": "Rust 备份核心", "type": "component", "package": "备份核心", "stereotype": "领域核心"},
        {"id": "Meta", "name": "SQLite 元数据", "type": "database", "package": "备份核心", "stereotype": "索引与状态"},
        {"id": "OS", "name": "操作系统调度器", "type": "actor", "package": "外部设施", "stereotype": "外部系统"},
        {"id": "Source", "name": "源文件系统", "type": "folder", "package": "外部设施", "stereotype": "数据源"},
        {"id": "Local", "name": "本地备份存储", "type": "folder", "package": "外部设施", "stereotype": "目标"},
        {"id": "Remote", "name": "WebDAV / S3 远程存储", "type": "cloud", "package": "外部设施", "stereotype": "目标"}
      ],
      "relations": [
        {"source": "GUI", "target": "API", "label": "任务、状态、恢复", "direction": "right", "style": "solid"},
        {"source": "CLI", "target": "API", "label": "命令与 JSON 结果", "direction": "right", "style": "solid"},
        {"source": "API", "target": "Daemon", "label": "提供", "direction": "right", "style": "solid"},
        {"source": "OS", "target": "Scheduler", "label": "计划触发", "direction": "left", "style": "solid"},
        {"source": "Daemon", "target": "Scheduler", "label": "编排运行", "direction": "down", "style": "solid"},
        {"source": "Scheduler", "target": "CoreAPI", "label": "调用", "direction": "right", "style": "solid"},
        {"source": "CoreAPI", "target": "Core", "label": "提供", "direction": "right", "style": "solid"},
        {"source": "Daemon", "target": "Meta", "label": "任务与运行状态", "direction": "right", "style": "solid"},
        {"source": "Core", "target": "Meta", "label": "快照索引", "direction": "down", "style": "solid"},
        {"source": "Core", "target": "Source", "label": "流式读取", "direction": "right", "style": "solid"},
        {"source": "Core", "target": "Local", "label": "仓库端口", "direction": "right", "style": "solid"},
        {"source": "Core", "target": "Remote", "label": "仓库端口", "direction": "right", "style": "solid"}
      ],
      "responsibilities": [
        {"element": "桌面 GUI / CLI", "responsibility": "提供交互和自动化入口，不直接修改仓库或 SQLite。"},
        {"element": "版本化本地接口", "responsibility": "统一客户端协议、事件流、错误语义和兼容性协商。"},
        {"element": "后台守护进程", "responsibility": "管理任务生命周期、计划触发、互斥、进度和通知。"},
        {"element": "Rust 备份核心", "responsibility": "实现扫描、变换、快照、校验、恢复和保留清理。"},
        {"element": "SQLite 元数据", "responsibility": "保存任务、运行、快照索引和校验结果，不保存用户文件内容。"},
        {"element": "源与目标存储", "responsibility": "通过端口提供源文件读取及本地、WebDAV、S3 仓库访问。"}
      ],
      "details": [
        "GUI 和 CLI 依赖同一本地接口，因此后台运行不会因 GUI 退出而中止。",
        "操作系统调度器只触发计划，具体互斥、重试和状态转换由后台服务负责。",
        "备份核心经统一仓库端口访问本地或远程目标，远程协议细节不得进入领域逻辑。",
        "SQLite 保存可重建的控制面元数据，备份内容和清单位于备份仓库。"
      ],
      "constraints": [
        "客户端、API、数据库和仓库格式必须显式版本化。",
        "同一任务不能并发执行两个修改仓库的操作。",
        "日志、状态事件和诊断包不得包含口令、主密钥或用户文件内容。"
      ],
      "trace": {
