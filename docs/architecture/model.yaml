      "responsibilities": [
        {"element": "BackupTask", "responsibility": "任务配置聚合根，维护源、筛选、调度、保留、保护和仓库配置的一致性。"},
        {"element": "FilterSet / FilterRule", "responsibility": "保存有序包含/排除规则，并支持路径、用户、组、时间和文件类型特化。"},
        {"element": "BackupRun", "responsibility": "记录一次执行的状态、统计、取消和失败信息。"},
        {"element": "Snapshot / FileEntry / ChunkReference", "responsibility": "表示不可变快照、目录清单和内容寻址块引用。"},
        {"element": "RepositoryConfig", "responsibility": "抽象本地、WebDAV 和 S3 的连接及目标位置配置。"},
        {"element": "RestoreRequest / RestoreResult", "responsibility": "描述恢复选择、目标、冲突策略及最终逐项统计。"}
      ],
      "details": [
        "BackupTask 对任务配置对象使用组合关系，删除任务配置不会默认删除独立存在的已提交快照。",
        "BackupRun 只有在原子提交成功后才关联一个 Snapshot，取消或失败运行不产生成功快照。",
        "Snapshot 组合文件条目，文件条目组合按顺序排列的数据块引用；实际块可被多个快照复用。",
        "筛选、调度、保护和仓库配置使用泛化表达合法变体，不把算法内部步骤建模为领域实体。"
      ],
      "constraints": [
        "快照一经提交即不可变，清单只引用已经完整写入的块和 pack。",
        "FilterSet 必须在保存任务时完成规则编译与复杂度校验。",
        "ProtectedKeyFileConfig 只保存密钥文件位置、密钥标识和 KDF 配置，不保存口令或主密钥。"
