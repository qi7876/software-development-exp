        "nfr": ["NFR-01", "NFR-02", "NFR-03", "NFR-04", "NFR-07", "NFR-10", "NFR-11", "NFR-12", "NFR-13"]
      }
    },
    {
      "id": "class-domain",
      "kind": "class",
      "view": "logical-class",
      "title": "备份领域模型类图",
      "purpose": "该图描述任务配置、运行、快照内容和恢复请求之间的稳定业务关系。组合关系用于表达生命周期所有权，泛化关系用于表达可替换的调度、筛选、保护和仓库配置。",
      "direction": "top to bottom",
      "packages": ["任务配置", "筛选规则", "运行与快照", "恢复"],
      "layout_chains": [
        ["ManualSchedule", "DailySchedule", "WeeklySchedule"],
        ["NoEncryption", "ProtectedKeyFile"],
        ["LocalRepo", "WebDAVRepo", "S3Repo"],
        ["PathRegexRule", "OwnerRule", "GroupRule", "TimeRule", "FileTypeRule"],
        ["BackupRun", "Snapshot", "FileEntry", "ChunkRef"]
      ],
      "elements": [
        {"id": "BackupTask", "name": "备份任务\nBackupTask", "stereotype": "aggregate root", "package": "任务配置", "attributes": ["+ taskId: TaskId", "+ name: String", "+ enabled: Boolean"], "operations": ["+ validate(): ValidationResult", "+ canStart(): Boolean"]},
        {"id": "SourceSpec", "name": "数据源\nSourceSpec", "stereotype": "value object", "package": "任务配置", "attributes": ["+ rootPath: Path", "+ symlinkPolicy: SymlinkPolicy"], "operations": ["+ contains(path): Boolean"]},
        {"id": "Schedule", "name": "调度策略\nSchedule", "stereotype": "abstract", "package": "任务配置", "attributes": [], "operations": ["+ nextAfter(time): Optional<Time>"]},
        {"id": "ManualSchedule", "name": "手动调度\nManualSchedule", "stereotype": "strategy", "package": "任务配置", "attributes": [], "operations": []},
        {"id": "DailySchedule", "name": "每日调度\nDailySchedule", "stereotype": "strategy", "package": "任务配置", "attributes": ["+ localTime: Time"], "operations": []},
        {"id": "WeeklySchedule", "name": "每周调度\nWeeklySchedule", "stereotype": "strategy", "package": "任务配置", "attributes": ["+ weekday: Weekday", "+ localTime: Time"], "operations": []},
        {"id": "RetentionPolicy", "name": "保留策略\nRetentionPolicy", "stereotype": "value object", "package": "任务配置", "attributes": ["+ keepLast: PositiveInt"], "operations": ["+ selectExpired(snapshots): SnapshotId[]"]},
        {"id": "ProtectionConfig", "name": "数据保护配置\nProtectionConfig", "stereotype": "abstract", "package": "任务配置", "attributes": [], "operations": ["+ encryptionEnabled(): Boolean"]},
        {"id": "NoEncryption", "name": "不加密\nNoEncryptionConfig", "stereotype": "configuration", "package": "任务配置", "attributes": [], "operations": []},
        {"id": "ProtectedKeyFile", "name": "口令保护密钥文件\nProtectedKeyFileConfig", "stereotype": "configuration", "package": "任务配置", "attributes": ["+ keyFilePath: Path", "+ keyId: KeyId", "+ kdfProfile: KdfProfile"], "operations": []},
        {"id": "RepositoryConfig", "name": "仓库配置\nRepositoryConfig", "stereotype": "abstract", "package": "任务配置", "attributes": ["+ repositoryId: RepositoryId"], "operations": ["+ validateLocation(): ValidationResult"]},
        {"id": "LocalRepo", "name": "本地仓库\nLocalRepositoryConfig", "stereotype": "configuration", "package": "任务配置", "attributes": ["+ path: Path"], "operations": []},
        {"id": "WebDAVRepo", "name": "WebDAV 仓库\nWebDAVRepositoryConfig", "stereotype": "configuration", "package": "任务配置", "attributes": ["+ endpoint: Url", "+ remotePath: String"], "operations": []},
        {"id": "S3Repo", "name": "S3 仓库\nS3RepositoryConfig", "stereotype": "configuration", "package": "任务配置", "attributes": ["+ endpoint: Url", "+ bucket: String", "+ prefix: String"], "operations": []},
        {"id": "FilterSet", "name": "筛选规则集\nFilterSet", "stereotype": "value object", "package": "筛选规则", "attributes": ["+ defaultDecision: Decision"], "operations": ["+ compile(): CompiledFilter", "+ evaluate(file): Decision"]},
        {"id": "FilterRule", "name": "筛选规则\nFilterRule", "stereotype": "abstract", "package": "筛选规则", "attributes": ["+ mode: IncludeOrExclude", "+ order: NonNegativeInt"], "operations": ["+ matches(file): Boolean"]},
        {"id": "PathRegexRule", "name": "路径正则规则\nPathRegexRule", "stereotype": "rule", "package": "筛选规则", "attributes": ["+ pattern: SafeRegex"], "operations": []},
