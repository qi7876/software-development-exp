      }
    },
    {
      "id": "component-core",
      "kind": "component",
      "view": "component",
      "title": "备份核心子系统构件图",
      "purpose": "该图细化备份核心内部的应用服务、内容处理流水线和端口适配器。所有可替换算法与外部存储均位于稳定接口之后，以便独立测试和逐步接入远程目标。",
      "direction": "top to bottom",
      "packages": ["应用服务", "内容处理流水线", "领域服务", "端口与适配器"],
      "layout_chains": [["SourcePort", "MetaPort", "RepoPort"]],
      "elements": [
        {"id": "TaskSvc", "name": "任务服务", "type": "component", "package": "应用服务", "stereotype": "service"},
        {"id": "Backup", "name": "备份协调器", "type": "component", "package": "应用服务", "stereotype": "service"},
        {"id": "Restore", "name": "恢复协调器", "type": "component", "package": "应用服务", "stereotype": "service"},
        {"id": "Scan", "name": "扫描与筛选", "type": "component", "package": "领域服务", "stereotype": "domain service"},
        {"id": "Snapshot", "name": "快照与索引管理", "type": "component", "package": "领域服务", "stereotype": "domain service"},
        {"id": "Verify", "name": "完整性校验", "type": "component", "package": "领域服务", "stereotype": "domain service"},
        {"id": "KeyFile", "name": "文本密钥文件服务", "type": "component", "package": "领域服务", "stereotype": "security service"},
        {"id": "Chunk", "name": "内容定义分块", "type": "component", "package": "内容处理流水线", "stereotype": "stage"},
        {"id": "Compress", "name": "压缩 / 解压", "type": "component", "package": "内容处理流水线", "stereotype": "strategy"},
        {"id": "Crypto", "name": "加密 / 解密", "type": "component", "package": "内容处理流水线", "stereotype": "strategy"},
        {"id": "Pack", "name": "打包 / 解包", "type": "component", "package": "内容处理流水线", "stereotype": "strategy"},
        {"id": "SourcePort", "name": "源文件端口", "type": "component", "package": "端口与适配器", "stereotype": "port"},
        {"id": "MetaPort", "name": "元数据端口", "type": "component", "package": "端口与适配器", "stereotype": "port"},
        {"id": "RepoPort", "name": "备份仓库端口", "type": "component", "package": "端口与适配器", "stereotype": "port"},
        {"id": "LocalAdapter", "name": "本地仓库适配器", "type": "component", "package": "端口与适配器", "stereotype": "adapter"},
        {"id": "WebDAVAdapter", "name": "WebDAV 适配器", "type": "component", "package": "端口与适配器", "stereotype": "adapter"},
        {"id": "S3Adapter", "name": "S3 适配器", "type": "component", "package": "端口与适配器", "stereotype": "adapter"}
      ],
      "relations": [
        {"source": "TaskSvc", "target": "Scan", "label": "预览与校验", "direction": "right", "style": "solid"},
        {"source": "TaskSvc", "target": "KeyFile", "label": "保护配置", "direction": "right", "style": "solid"},
        {"source": "Backup", "target": "Scan", "label": "扫描候选文件", "direction": "right", "style": "solid"},
        {"source": "Scan", "target": "SourcePort", "label": "读取元数据与内容", "direction": "right", "style": "solid"},
        {"source": "Backup", "target": "Chunk", "label": "文件流", "direction": "right", "style": "solid"},
        {"source": "Chunk", "target": "Compress", "label": "数据块", "direction": "right", "style": "solid"},
        {"source": "Compress", "target": "Crypto", "label": "压缩块", "direction": "right", "style": "solid"},
        {"source": "Crypto", "target": "Pack", "label": "认证密文块", "direction": "right", "style": "solid"},
        {"source": "KeyFile", "target": "Crypto", "label": "解锁后的主密钥", "direction": "right", "style": "solid"},
        {"source": "Pack", "target": "RepoPort", "label": "不可变 pack", "direction": "right", "style": "solid"},
        {"source": "Backup", "target": "Snapshot", "label": "原子提交", "direction": "right", "style": "solid"},
        {"source": "Snapshot", "target": "MetaPort", "label": "索引与状态", "direction": "right", "style": "solid"},
        {"source": "Restore", "target": "RepoPort", "label": "读取对象", "direction": "right", "style": "solid"},
        {"source": "Restore", "target": "Pack", "label": "逆向流水线", "direction": "right", "style": "solid"},
        {"source": "Restore", "target": "Verify", "label": "恢复后校验", "direction": "right", "style": "solid"},
        {"source": "Verify", "target": "RepoPort", "label": "读取并重算哈希", "direction": "right", "style": "solid"},
        {"source": "LocalAdapter", "target": "RepoPort", "label": "实现", "direction": "left", "style": "dependency"},
        {"source": "WebDAVAdapter", "target": "RepoPort", "label": "实现", "direction": "left", "style": "dependency"},
        {"source": "S3Adapter", "target": "RepoPort", "label": "实现", "direction": "left", "style": "dependency"}
      ],
      "responsibilities": [
        {"element": "任务服务", "responsibility": "管理任务配置、筛选预览、保护配置和保存前校验。"},
        {"element": "备份 / 恢复协调器", "responsibility": "编排长时间运行流程、取消点、失败隔离和状态报告。"},
        {"element": "扫描与筛选", "responsibility": "对预览和正式备份执行同一套有序规则。"},
        {"element": "内容处理流水线", "responsibility": "写入按分块、压缩、加密、打包执行，读取严格逆序。"},
        {"element": "文本密钥文件服务", "responsibility": "创建和读取版本化 JSON 密钥文件，仅向加密策略提供内存中的主密钥。"},
        {"element": "仓库端口与适配器", "responsibility": "统一对象读写、列举、临时上传、原子提交及能力探测。"}
      ],
      "details": [
        "任务服务在保存任务前编译筛选规则并验证源、目标、调度和算法组合。",
        "备份写入顺序固定为分块、压缩、可选认证加密、打包；恢复按相反顺序读取。",
        "快照服务只在全部 pack 和清单可读取后发布提交标记，再写入成功状态。",
        "本地、WebDAV 和 S3 适配器实现同一仓库端口，核心只依赖端口能力。"
      ],
      "constraints": [
        "每个块必须记录格式、压缩算法、加密算法和版本。",
        "未知的必需算法必须拒绝读取，不得猜测或静默降级。",
        "错误口令、损坏密钥文件或认证失败不得输出最终明文。"
      ],
      "trace": {
