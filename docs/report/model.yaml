      ],
      "details": ["core、daemon、protocol 已合并为同一 Cargo package；无独立业务 CLI、共享协议 crate 或进程间 IPC。", "运行 data-backup 默认启动服务器；-d 设置工作目录，-h 和 -v 分别显示帮助及版本后退出。", "GET / 提供公开控制台，GET /api/status 必须使用 Authorization: Bearer <secret_key>。", "计划执行将由同进程调度逻辑触发；关闭浏览器不终止服务器。服务器退出时计划任务不再执行。"],
      "constraints": ["当前状态返回 backup_available=false，图中虚线连接未实现。", "API secret key 与备份加密口令、仓库主密钥分别管理；不得写入 URL、响应或日志。", "默认示例绑定 127.0.0.1:8080；HTTP 无内置 TLS，远程访问由 HTTPS 反向代理提供加密。", "后续同一任务不能并发执行两个修改仓库的操作。"],
