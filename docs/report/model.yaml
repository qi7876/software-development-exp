    {
      "id": "component-overview",
      "kind": "component",
      "view": "container",
      "title": "bak: Runtime and Local Storage",
      "purpose": "单一服务进程提供嵌入式 UI、认证 API 和 FIFO worker；浏览器、密钥文件、作业库与仓库各有独立状态边界。",
      "responsibilities": [
        {
          "element": "浏览器 / bak / 本地存储",
          "responsibility": "单一服务进程提供嵌入式 UI、认证 API 和 FIFO worker；浏览器、密钥文件、作业库与仓库各有独立状态边界。"
        }
      ],
      "details": [
        "浏览器可连接同一或另一台 bak API；连接名称、地址和明文 API key 保存在浏览器 origin 的 localStorage。",
        "工作目录作业库 schema v2，仓库 schema/format v3；保留命名密钥文件以恢复旧备份。",
        "普通文件载荷按备份选择原样、Zstd、XChaCha20-Poly1305 或先压缩后加密；元数据和文件名仍是明文。"
      ],
      "constraints": [
        "一个工作目录只运行一个服务实例，SQLite 使用本地文件系统。",
        "作业库、仓库库和载荷文件不共享事务；旧数据库拒绝且不迁移。",
        "静态 UI 公开，API 需 Bearer；服务无内置 TLS，加密不保护元数据。"
      ],
