    {
      "id": "class-services",
      "kind": "class",
      "view": "logical-class",
      "title": "Facade, Modules and Data Access",
      "purpose": "展示现有门面、密钥容器、筛选与编码管线的协作，不把模块表达为新增运行时服务。",
      "responsibilities": [
        {
          "element": "JobManager / Keyring",
          "responsibility": "管理持久化队列、分页历史和不可变命名密钥。"
        },
        {
          "element": "Content / backup / restore",
          "responsibility": "将有界缓冲的编码 IO 与文件遍历、校验和同步组合。"
        }
      ],
      "details": [
        "JobManager 持有 Arc<Keyring>，提交时固定标识与指纹，worker 执行前再次匹配。",
        "Content 用 Option<ZstdOptions> 与 Option<Encryption> 选择实际 IO 管线，组合顺序固定为先压缩后加密。",
        "Filter::compile 在备份执行时校验正则和时间范围，CompiledFilter::matches 决定目录是否继续遍历。"
      ],
      "constraints": [
        "Zstd 参数范围 1–22 默认 3；无加密配置仍可运行不加密操作。",
        "读取加密流必须验证最终认证块；失败不得报告成功，可能保留部分输出。"
