          "responsibility": "模块操作对应 Rust 函数，JobManager 是真实门面；关系表示调用与依赖，模块不是独立运行时服务。"
        }
      ],
      "details": [
        "JobManager 管理 SqlitePool、工作目录与 Notify；通知用于唤醒，SQLite 是队列事实来源。",
        "backup::run 和 restore::run 是同步操作，通过 Tokio 阻塞任务协作异步元数据 IO。"
      ],
      "constraints": [
        "API 不直接访问 repository 私有模块。",
        "元数据持久化使用 SQLx 事务；数据库池不在压缩期间持有写事务。"
      ],
