        "逆向解码并验证最终认证块、原文大小与哈希；子项完成后应用目录与根元数据。"
      ],
      "constraints": [
        "恢复不接受编码参数，由备份记录自动决定。",
        "密钥缺失/变化在条目写入前失败；后续失败可能留下部分输出。"
