    {
      "id": "component-overview",
      "kind": "component",
      "view": "container",
      "title": "bak: Runtime and Local Storage",
      "purpose": "后台或前台 Rust 服务提供外部静态 WebUI、认证 API、启动对账和 FIFO worker；密钥、任务数据库及自包含备份具有独立持久化边界。",
      "responsibilities": [
        {
          "element": "浏览器 / bak / 本地存储",
          "responsibility": "后台或前台 Rust 服务提供外部静态 WebUI、认证 API、启动对账和 FIFO worker；密钥、任务数据库及自包含备份具有独立持久化边界。"
        }
      ],
      "details": [
        "浏览器可连接同一或另一台 bak API；地址和明文 API key 保存在浏览器 origin 的 localStorage。",
        "工作目录使用 schema v5 作业库。仓库存放自包含 v10 备份。加密密钥来自配置指定的文件。",
        "自实现顺序归档后选择无压缩、Zstd 或自实现 LZ77，再独立选择 XChaCha20-Poly1305 或 AES-256-GCM 加密，形成九种模式；元数据和文件名仍为明文。",
        "配置式定时备份使用 IANA 时区与分钟级 Cron，复用 FIFO；停机不补跑，同一计划有未完成任务时跳过。",
        "bak server start 默认创建后台子进程并等待就绪；status/stop 通过当前用户的 Unix socket 管理实例。",
        "静态 WebUI 独立部署并由 web_ui.path 指定目录，资源在请求时读取；任务库仍为 SQLite，仓库不使用数据库。",
        "启动在 HTTP 和 worker 之前按持久化任务 ID 对账：验证已发布文件或发布唯一完整临时文件，再提交结果。"
      ],
      "constraints": [
        "一个工作目录只运行一个服务实例，SQLite 使用本地文件系统。",
        "同步并发布备份文件后提交作业终态。",
        "静态 UI 公开，API 采用 Bearer 认证；载荷按配置加密，外层元数据明文保存。"
      ],
