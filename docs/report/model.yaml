    {
      "id": "sequence-configure",
      "kind": "sequence",
      "view": "sequence",
      "title": "Service Startup, Shutdown and Recovery",
      "purpose": "配置启动和生命周期时序按真实程序描述；重启先处理历史，再提供接口和继续排队工作。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "配置启动和生命周期时序按真实程序描述；重启先处理历史，再提供接口和继续排队工作。"
        }
      ],
      "details": [
        "SIGKILL 没有正常关闭步骤；下一次 open 将遗留 running 标为 failed。",
        "worker 或 HTTP 意外终止触发监督失败和非零退出。"
      ],
      "constraints": [
        "中断操作不重放；文件副作用可能存在。",
        "帮助和版本不启动服务。"
      ],
