    {
      "id": "class-domain",
      "kind": "class",
      "view": "logical-class",
      "title": "Job and Repository Data Types",
      "purpose": "作业保存请求和可选编码配置，仓库保存可恢复的类型、Unix 元数据和统计；模型直接对应 Rust 数据类型。",
      "responsibilities": [
        {
          "element": "JobInfo / BackupOptions",
          "responsibility": "保存作业状态和执行配置；压缩与加密均以 Option 表示。"
        },
        {
          "element": "Manifest / ManifestEntry",
          "responsibility": "保存根元数据、编码方式、条目、符号链接目标与统计。"
        }
      ],
      "details": [
        "BackupOptions.compression 为 Option<CompressionOptions>；None 禁用，Some 为 Zstd 或 LZ77 专属配置，API、任务与仓库元数据均使用带 algorithm 标签的对象。",
        "Encryption 包含 algorithm、key_id 与 fingerprint，不保存密钥材料；Filter 的规则也随请求持久化。",
        "ManifestEntry 的 kind 记录条目类型。HardLink 指向先前记录的原始条目。UnixMetadata 包含纳秒时间戳。",
        "普通手动备份的 schedule_id/scheduled_for 均为空；自动触发保存计划标识和匹配分钟，立即运行计划保存计划标识与请求时刻；时间均为 UTC Unix 毫秒。"
      ],
      "constraints": [
        "仓库保存完整算法配置，XChaCha 载荷 v2 或 AES 载荷 v3 对配置进行认证；恢复自动使用记录的解码器。",
        "SHA-256 覆盖除末尾摘要自身外的容器全部字节；archive_checksum 读取时由尾部派生，不序列化到自身校验范围；original_size 描述原文。"
      ],
