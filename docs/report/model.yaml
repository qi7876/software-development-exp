      "details": ["BackupTask 对任务配置对象使用组合关系，删除任务配置不会默认删除独立存在的已提交快照。", "BackupRun 只有在原子提交成功后才关联一个 Snapshot，取消或失败运行不产生成功快照。", "Snapshot 组合文件条目，文件条目组合按顺序排列的数据块引用；实际块可被多个快照复用。", "筛选、调度、保护和仓库配置使用字段与合法变体表达，不预先建立策略接口或类继承层次。"],
