        "JobState 是带成功结果或失败错误的枚举。",
        "Manifest 作为内存类型读写 SQLite，名称不表示使用 JSON manifest 文件。",
        "仓库条目按 ordinal 排序，文件载荷位置由相对路径决定。"
      ],
      "constraints": [
        "HTTP 作业 JSON 是状态与结果/错误的映射，不暴露内部类型或数据库连接。",
        "元数据 schema 与压缩、校验算法有版本检查。"
