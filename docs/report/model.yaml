    {
      "id": "sequence-configure",
      "kind": "sequence",
      "view": "sequence",
      "title": "Service Startup, Shutdown and Recovery",
      "purpose": "配置启动和生命周期时序按真实程序描述；重启先处理历史，再提供接口和继续排队工作。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "配置启动和生命周期时序按真实程序描述；重启先处理历史，再提供接口和继续排队工作。"
        }
      ],
      "details": [
        "配置和命名密钥只在启动时加载；无效密钥或旧作业库版本导致启动失败。",
        "静态资源可公开访问；浏览器选择服务后通过认证状态接口获取版本与密钥指纹。",
        "keygen 是独立命令，不启动 HTTP 服务；此图只展示服务启动与正常关闭。"
      ],
      "constraints": [
        "配置不热加载，更换密钥配置后重启并重新连接。",
        "终止只等待活动操作，不自动重放已中断操作。"
      ],
      "trace": {
