          "NFR-01",
          "NFR-02",
          "NFR-03",
          "NFR-05",
          "NFR-06",
          "NFR-07"
        ]
      },
      "participants": [
        {
          "id": "Client",
          "name": "HTTP client",
          "type": "actor"
        },
        {
          "id": "API",
          "name": "API",
          "type": "boundary"
        },
        {
          "id": "Jobs",
          "name": "JobManager / worker",
          "type": "control"
        },
        {
          "id": "DB",
          "name": "jobs.sqlite3",
          "type": "database"
        },
        {
          "id": "Backup",
          "name": "backup",
          "type": "control"
        },
        {
          "id": "Repo",
          "name": "Repository",
          "type": "database"
        }
      ],
      "steps": [
        {
          "type": "message",
          "source": "Client",
          "target": "API",
          "text": "POST /api/backups + Bearer key"
        },
        {
          "type": "message",
          "source": "API",
          "target": "Jobs",
          "text": "Validate level / pin key fingerprint / submit"
        },
        {
          "type": "message",
          "source": "Jobs",
          "target": "DB",
          "text": "Commit queued job"
        },
        {
          "type": "return",
          "source": "API",
          "target": "Client",
          "text": "202 + Location + queued job"
        },
        {
          "type": "message",
          "source": "Jobs",
          "target": "DB",
          "text": "Claim oldest queued job as running"
        },
        {
          "type": "message",
          "source": "Jobs",
          "target": "Backup",
          "text": "Execute through spawn_blocking"
        },
        {
          "type": "message",
          "source": "Backup",
          "target": "Backup",
          "text": "Match pinned key / compile filter / prune traversal"
        },
        {
          "type": "message",
          "source": "Backup",
          "target": "Backup",
          "text": "Encode raw / Zstd / AEAD / Zstd then AEAD"
        },
        {
          "type": "message",
          "source": "Backup",
          "target": "Repo",
          "text": "Synchronize payload files and directories"
        },
        {
          "type": "alt",
          "text": "Payload processing succeeded"
        },
        {
          "type": "message",
          "source": "Backup",
          "target": "Repo",
          "text": "Commit v3 header / entries / metadata / counts"
        },
        {
          "type": "return",
          "source": "Backup",
          "target": "Jobs",
          "text": "backup_id"
        },
        {
          "type": "message",
          "source": "Jobs",
          "target": "DB",
          "text": "Commit succeeded result"
        },
        {
          "type": "else",
          "text": "Processing or publication failed"
        },
        {
          "type": "return",
          "source": "Backup",
          "target": "Jobs",
          "text": "Operation error"
        },
        {
          "type": "message",
          "source": "Jobs",
          "target": "DB",
          "text": "Commit failed outcome"
        },
        {
          "type": "end",
          "text": ""
        },
        {
          "type": "message",
          "source": "Client",
          "target": "API",
          "text": "GET job Location"
        },
        {
          "type": "message",
          "source": "API",
          "target": "Jobs",
          "text": "Read durable job"
        },
        {
          "type": "return",
          "source": "API",
          "target": "Client",
          "text": "200 + state / result / error"
        }
      ]
    },
