        {"element": "data-backup", "responsibility": "唯一产品进程，内嵌 HTML 与 JavaScript，提供 Axum 路由、认证和状态查询；备份与调度按需在同进程内增加。"},
        {"element": "config.json", "responsibility": "工作目录中的启动配置，仅包含必需的 listen 和 secret_key 字段，启动后修改需重启。"},
