      "id": "class-services",
      "kind": "class",
      "view": "logical-class",
      "title": "Facade, Modules and Data Access",
      "purpose": "展示门面、密钥容器、筛选与编码管线的协作。",
      "responsibilities": [
        {
          "element": "JobManager / Keyring",
          "responsibility": "管理持久化队列、分页历史和不可变命名密钥。"
        },
        {
          "element": "Content / backup / restore",
          "responsibility": "将有界缓冲的编码 IO 与文件遍历、校验和同步组合。"
        }
      ],
      "details": [
        "JobManager 持有 Arc<Keyring>，提交时固定标识与指纹，worker 执行前再次匹配。",
        "archive 打包后由 Content 选择可选 CompressionOptions 和 Encryption；LZ77 通过 Encoder/Decoder 流式处理，组合顺序固定先压缩后加密。",
        "Filter::compile 在执行时校验正则和时间范围。路径或元数据规则决定是否遍历目录，文件类型筛选保留所选条目所需的父目录。",
        "Scheduler 使用 croner/chrono-tz 并保留全部计划的不可变目录；AES 使用 HKDF-SHA256 为每个归档派生密钥，两个算法共用 STREAM BE32 和最终块验证。"
      ],
      "constraints": [
        "Zstd level 为 1–22；LZ77 窗口 4–1024 KiB，候选上限 1–256，编码与解码均有界缓冲。",
        "读取加密流时验证最终认证块；校验失败记录失败状态并保留输出。"
      ],
