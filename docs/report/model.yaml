    {
      "id": "component-core",
      "kind": "component",
      "view": "component",
      "title": "bak: Module Responsibilities",
      "purpose": "模块按现有职责组织，HTTP 通过 JobManager 门面调用业务，私有模块不为测试暴露。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "模块按现有职责组织，HTTP 通过 JobManager 门面调用业务，私有模块不为测试暴露。"
        }
      ],
      "details": [
        "server 管理 listener、信号、HTTP 与 worker 的监督和退出。",
        "server::api 负责认证、请求验证和 JSON 响应；作业阻塞操作通过 spawn_blocking 执行。",
        "跨组件测试在 tests 中启动真实二进制；组件测试与实现内联。"
      ],
      "constraints": [
        "无额外服务、独立业务 CLI、共享协议 crate 或预建抽象层。",
        "服务停止领取新作业后等待活动作业完成；worker 或持久化错误使服务失败退出。"
      ],
