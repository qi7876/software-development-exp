    {
      "id": "component-overview",
      "kind": "component",
      "view": "container",
      "title": "bak: Runtime and Local Storage",
      "purpose": "单一 bak 进程提供认证 HTTP 接口与作业执行；源、作业历史、仓库元数据和镜像载荷有独立责任。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "单一 bak 进程提供认证 HTTP 接口与作业执行；源、作业历史、仓库元数据和镜像载荷有独立责任。"
        }
      ],
      "details": [
        "工作目录中的 jobs.sqlite3 保存作业队列和历史；仓库根目录的 repository.sqlite3 保存已发布备份。",
        "每个备份的压缩内容保留源相对路径；目录记录保留空目录。",
        "客户端只有 HTTP API 入口，当前无 Web 控制台。"
      ],
      "constraints": [
        "单工作目录仅运行一个服务实例；SQLite 位于本地文件系统。",
        "两个数据库与外部文件不共享事务；正常文件同步不等于断电测试保证。"
      ],
