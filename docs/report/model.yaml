      "details": [
        "提交时校验等级并固定命名密钥指纹；正则/时间范围在执行时编译，失败发生在载荷写入前。",
        "目录剪枝同时作用于路径和元数据条件；符号链接只保存目标。",
        "完成流式归档/编码后追加明文 manifest、长度、标记及 SHA-256，文件同步后硬链接发布并同步目录，再单独提交作业终态。",
        "LZ77 的候选搜索、历史窗口和 IO 均有限制；完成编解码终止标记后再完成加密最终认证块。",
        "新执行备份使用已持久化任务 ID 作为备份 ID，为启动对账提供确定关联。"
      ],
      "constraints": [
        "备份期间保持源文件稳定，复制时检查大小变化。普通失败清理本次临时输出，启动时校验并对账崩溃遗留文件。",
        "任务 JSON 保存密钥标识与指纹；备份文件发布后提交作业终态。"
