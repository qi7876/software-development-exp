    {
      "id": "class-domain",
      "kind": "class",
      "view": "logical-class",
      "title": "Job and Repository Data Types",
      "purpose": "作业保存请求和可选编码配置，仓库保存可恢复的类型、Unix 元数据和统计；模型直接对应 Rust 数据类型。",
      "responsibilities": [
        {
          "element": "JobInfo / BackupOptions",
          "responsibility": "保存作业状态和执行配置；压缩与加密均以 Option 表示。"
        },
        {
          "element": "Manifest / ManifestEntry",
          "responsibility": "保存根元数据、编码方式、条目、符号链接目标与统计。"
        }
      ],
      "details": [
        "BackupOptions.compression 为 Option<ZstdOptions>，None 无压缩参数；Some 保存 level。任务 JSON 边界仍使用 compression/compression_level。",
        "Encryption 只包含 key_id 与 fingerprint，不保存密钥材料；Filter 的规则也随请求持久化。",
        "ManifestEntry 是结构体，kind 才是区分 File/Directory/Symlink 的枚举。UnixMetadata 包含纳秒时间戳。"
      ],
      "constraints": [
        "压缩等级只影响编码，不写入载荷 AAD 或仓库头；恢复自动选择模式。",
        "SHA-256 与 original_size 始终针对原文，跳过统计只计已遇到的条目。"
      ],
