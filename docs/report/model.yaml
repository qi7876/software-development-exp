    {
      "id": "sequence-backup",
      "kind": "sequence",
      "view": "sequence",
      "title": "Accepted Job to Published Full Backup",
      "purpose": "接受请求、执行、仓库发布和结果持久化是不同阶段；HTTP 202 仅表示作业已入库。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "接受请求、执行、仓库发布和结果持久化是不同阶段；HTTP 202 仅表示作业已入库。"
        }
      ],
      "details": [
        "提交时校验等级并固定命名密钥指纹；正则/时间范围在执行时编译，失败发生在载荷写入前。",
        "目录剪枝同时作用于路径和元数据条件；符号链接只保存目标。",
        "完成编码与同步后一次提交头、条目、根元数据和统计，再单独提交作业终态。"
      ],
      "constraints": [
        "备份源保持不变；无源一致性检测和失败自动清理。",
        "任务 JSON 不含加密密钥；两库和外部文件不共享事务。"
      ],
      "trace": {
        "use_cases": [
          "UC-03",
          "UC-06"
        ],
        "requirements": [
          "FR-03",
          "FR-06",
          "FR-09",
