        "UTC 高水位持久化；时钟前跳不补跑，后跳不重复；重启从下一分钟继续。",
        "计划页面包含启用与停用项；立即执行使用保存配置并共享活动计划约束，返回 202 或 busy/404/key 错误，不改变 UTC 游标。"
