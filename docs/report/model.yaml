    {
      "id": "component-core",
      "kind": "component",
      "view": "component",
      "title": "bak: Module Responsibilities",
      "purpose": "模块按职责组织，HTTP 通过 JobManager 门面调用业务。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "模块按职责组织，HTTP 通过 JobManager 门面调用业务。"
        },
        {
          "element": "server::schedule::Scheduler",
          "responsibility": "配置校验、分钟匹配、调用持久化入队；不直接读写备份载荷。"
        }
      ],
      "details": [
        "main/args/config 分派 help、version、keygen、server 命令并加载配置；daemon 创建后台子进程和本地控制接口，工作目录锁防止重复实例。",
        "server::ui 从 web_ui.path 运行时读取静态文件；server::api 处理认证、CORS、计划查看及立即执行；worker 通过 spawn_blocking 执行业务。",
        "backup::filter 执行严格目录剪枝；archive 负责顺序条目与结束标记；content 组合私有 crypto、lz77 与 Zstd；repository 封装自包含元数据、摘要和不可覆盖发布。",
        "jobs::recovery 对账中断任务，完整验证并补记成功或记录失败；只清理确认同一 inode 的临时硬链接。",
        "server::schedule 编译计划并匹配时区/Cron；API 共享不可变计划目录；自动触发推进游标，立即执行不改游标，两者共享活动计划约束。",
        "主图聚焦启动、服务、作业和文件操作边界；filter 隶属 backup，crypto/lz77 隶属 content，filesystem/storage 为共享内部工具，详见模块树与类型图。"
      ],
      "constraints": [
        "图中元素对应 Rust 模块及其调用关系。",
        "外部经 jobs 门面使用业务与密钥能力；crypto、lz77、filter、schedule 按所属模块私有化。"
      ],
