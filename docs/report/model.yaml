    {
      "id": "component-core",
      "kind": "component",
      "view": "component",
      "title": "bak: Module Responsibilities",
      "purpose": "模块按现有职责组织，HTTP 通过 JobManager 门面调用业务，私有模块不为测试暴露。",
      "responsibilities": [
        {
          "element": "本图",
          "responsibility": "模块按现有职责组织，HTTP 通过 JobManager 门面调用业务，私有模块不为测试暴露。"
        }
      ],
      "details": [
        "main/args/config 负责服务启动与 keygen 分支；启动加载 Keyring 后交给 JobManager。",
        "server::ui 提供编译时静态资源，server::api 处理认证、CORS、校验和响应；worker 以 spawn_blocking 执行业务。",
        "backup 使用 filter 严格目录剪枝；content 组合压缩/加密 IO；crypto 管理密钥及 STREAM 帧；repository 原子保存元数据。"
      ],
      "constraints": [
        "图中元素对应现有模块，无独立前端服务、API 代理或新增框架。",
        "API 通过 JobManager 访问业务；main 同时使用 crypto 的密钥生成与加载入口。"
      ],
