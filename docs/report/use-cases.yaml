{
  "version": "6.0",
  "updated": "2026-11-16",
  "author": "项目开发者",
  "system": "bak Local Backup Service",
  "functional_requirements": [
    {
      "id": "FR-01",
      "name": "服务启动与配置",
      "description": "根命令仅含 help、version、keygen、server 子命令；server start -d 后台启动，status/stop 管理当前用户实例，--foreground 前台运行；读取配置、命名密钥与作业库并先完成启动对账。"
    },
    {
      "id": "FR-02",
      "name": "认证与状态",
      "description": "Bearer key 保护 API；状态返回版本和加密密钥标识/指纹。公开静态控制台可连接远程 API，CORS 预检先于认证且不使用 cookie。"
    },
    {
      "id": "FR-03",
      "name": "全量备份",
      "description": "全量备份普通文件、空目录、Unix 元数据与符号链接目标；每个 .bak 自包含编码参数、条目、统计与校验，SHA-256 覆盖除末尾摘要自身外的全部容器字节。"
    },
    {
      "id": "FR-04",
      "name": "备份列表",
      "description": "扫描正式 .bak 的元数据并按时间降序、同时间编号升序返回摘要；空仓库不创建数据库，临时文件被忽略，损坏的正式文件返回错误。"
    },
    {
      "id": "FR-05",
      "name": "恢复与校验",
      "description": "恢复到独立的已有空目录，预先校验全部条目路径；自动解密/解压，校验认证最终块、文件大小及整包 SHA-256，并恢复 Unix 元数据和符号链接。"
    },
    {
      "id": "FR-06",
      "name": "持久化作业与历史",
      "description": "请求先入库再返回 202/Location；单 worker FIFO 执行，查询与游标分页展示请求、状态、结果和时间。普通手动备份无计划标识，自动及立即执行计划保存 schedule_id 与 scheduled_for。"
    },
    {
      "id": "FR-07",
      "name": "关闭与重启恢复",
      "description": "正常关闭等待活动作业完成、保留 queued；重启校验中断备份并对账，完整输出补记成功，否则失败且不重放；继续 queued 并保留终态历史。"
    },
    {
      "id": "FR-08",
      "name": "浏览器控制台与连接管理",
      "description": "独立部署的静态控制台提供创建备份、仓库恢复、定时计划、任务记录及连接管理；配置 web_ui.path 后运行时读取资源，浏览器验证成功才切换服务并清空旧服务数据。"
    },
    {
      "id": "FR-09",
      "name": "路径与元数据筛选",
      "description": "相对路径、UID/GID、八进制权限的包含/排除正则与 atime/mtime 时间区间组合筛选；目录不匹配则剪除整个子树。"
    },
    {
      "id": "FR-10",
      "name": "Unix 元数据与统计",
      "description": "将根和条目的 UID/GID、权限、纳秒时间戳、符号链接目标及互斥统计写入自包含备份；同步完整临时文件后，以不可覆盖硬链接发布并同步目录。"
    },
    {
      "id": "FR-11",
      "name": "可选压缩与内容加密",
      "description": "压缩选择无、Zstd 或自实现流式 LZ77，并可独立加密，构成九种模式。Zstd 等级 1–22；LZ77 窗口 4–1024 KiB、搜索上限 1–256。同时启用固定先压缩后加密。 加密可选择 XChaCha20-Poly1305 或 AES-256-GCM，形成九种组合；恢复自动读取保存的算法与密钥。"
    },
    {
      "id": "FR-12",
      "name": "命名密钥生成与使用",
      "description": "keygen 创建随机 256 位密钥文件且拒绝覆盖；启动加载命名密钥，任务与备份固定标识和指纹，密钥缺失或变化时明确失败。"
    },
    {
      "id": "FR-13",
      "name": "配置式定时备份",
      "description": "配置 IANA 时区与五字段 Cron；控制台或认证 API 可查看启用/停用计划，并按保存配置立即入队。自动触发与立即执行共享活动计划约束，立即执行不改变 Cron 游标；编辑仍需改配置后重启。"
    }
  ],
  "nonfunctional_requirements": [
    {
      "id": "NFR-01",
      "name": "数据正确性",
      "description": "恢复后相对路径、条目类型、内容及支持的 Unix 元数据正确；不修改源和已有成功备份。"
    },
    {
      "id": "NFR-02",
      "name": "流式处理",
      "description": "文件编码、解码、认证和校验有界缓冲；遍历条目与元数据列表仍随条目数增长。"
    },
    {
      "id": "NFR-03",
      "name": "可观测性",
      "description": "输入、数据库与作业执行失败有明确错误；worker 或结果持久化失败导致服务失败退出。"
    },
    {
      "id": "NFR-04",
      "name": "响应性",
      "description": "阻塞文件操作在 Tokio blocking task 中运行，状态和作业查询保持可用；性能基线通过实测记录。"
    },
    {
      "id": "NFR-05",
      "name": "持久化边界",
      "description": "作业 SQLite 使用 WAL、FULL 同步和事务；文件发布与作业终态提交独立，通过幂等启动对账修复中断备份；单工作目录持有独占实例锁。"
    },
    {
      "id": "NFR-06",
      "name": "安全边界",
      "description": "API key 与加密密钥分离；AEAD 保护归档流并绑定编码参数，容器外层元数据仍明文且不完全受 AEAD 认证。浏览器 API key 明文存入 localStorage；服务无内置 TLS。"
    },
    {
      "id": "NFR-07",
      "name": "平台与验证边界",
      "description": "当前备份和恢复执行支持 Unix，实测平台为 macOS；短时验证不等于长期稳定性或断电保证。"
    }
  ],
