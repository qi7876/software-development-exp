      ],
      "business_rules": [],
      "notes": "web_ui 可省略，默认关闭；enabled=true 提供编译时嵌入的控制台。旧 archive_url/directory 字段被忽略；logging 已废弃。作业 schema v3、仓库 schema/format v4，旧数据库拒绝且不迁移。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "准备配置并执行 bak -d <目录>。"
