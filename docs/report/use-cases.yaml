        {
          "id": "B2",
          "actor": "系统",
          "action": "验证请求、持久化 queued 并返回 202/Location。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "worker 检查已有空目标和路径不重叠，读取指定备份元数据并匹配密钥。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "在写入前验证全部相对路径，然后自动解密/解压、校验原文大小与哈希并重建符号链接。"
        },
        {
          "id": "B5",
          "actor": "系统",
          "action": "恢复文件、目录及根的 Unix 元数据，同步输出并保存终态结果。"
        }
