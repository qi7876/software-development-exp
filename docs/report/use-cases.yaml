{
  "version": "1.0",
  "updated": "2026-10-14",
  "author": "项目开发者",
  "system": "bak Local Backup Service",
  "functional_requirements": [
    {
      "id": "FR-01",
      "name": "服务启动与配置",
      "description": "bak 从已有工作目录读取 config.json；支持帮助、版本和工作目录参数，配置或启动失败可见。"
    },
    {
      "id": "FR-02",
      "name": "认证与状态",
      "description": "HTTP API 使用 Bearer secret key；状态返回 version，错误使用统一 JSON。"
    },
    {
      "id": "FR-03",
      "name": "全量备份",
      "description": "备份已有源目录中的普通文件和目录，拒绝路径重叠与源内符号链接；Zstd 压缩并记录原始大小、SHA-256 和 UTC 时间。"
    },
    {
      "id": "FR-04",
      "name": "备份列表",
      "description": "仅列出已提交元数据的备份编号和创建时间；时间降序、同时间编号升序；未初始化仓库返回空列表且不建库。"
    },
    {
      "id": "FR-05",
      "name": "恢复与校验",
      "description": "恢复到已有、空且不与仓库重叠的目录；预先验证全部相对路径，验证解压大小和 SHA-256，不覆盖已有内容。"
    },
    {
      "id": "FR-06",
      "name": "持久化作业与历史",
      "description": "提交备份和恢复先持久化再返回 202 与 Location；单个 worker 按 FIFO 执行，查询 queued/running/succeeded/failed 和结果或错误。"
    },
    {
      "id": "FR-07",
      "name": "关闭与重启恢复",
      "description": "正常关闭等待活动操作完成并留下排队作业；重启将中断的 running 作业标为失败、不重放，继续 queued 作业并保留终态历史。"
    }
  ],
  "nonfunctional_requirements": [
    {
      "id": "NFR-01",
      "name": "数据正确性",
      "description": "恢复后相对路径、目录类型和文件内容一致；已有源和成功备份不被恢复修改。"
    },
    {
      "id": "NFR-02",
      "name": "流式处理",
      "description": "文件压缩、解压和校验使用缓冲区流式处理；元数据和遍历列表仍随条目数增长。"
    },
    {
      "id": "NFR-03",
      "name": "可观测性",
      "description": "输入、数据库与作业执行失败有明确错误；worker 或结果持久化失败导致服务失败退出。"
    },
    {
      "id": "NFR-04",
      "name": "响应性",
      "description": "阻塞文件操作在 Tokio blocking task 中运行，状态和作业查询保持可用；性能基线通过实测记录。"
    },
    {
      "id": "NFR-05",
      "name": "持久化边界",
      "description": "SQLite 使用 WAL、FULL 同步和事务；两个数据库与外部文件不共享事务，单工作目录只运行一个服务。"
    },
    {
      "id": "NFR-06",
      "name": "安全边界",
      "description": "API key 控制访问；恢复拒绝危险元数据路径与占用目录；HTTP 无内置 TLS，仓库内容未加密。"
    },
    {
      "id": "NFR-07",
      "name": "平台与验证边界",
      "description": "当前备份和恢复执行支持 Unix，实测平台为 macOS；短时验证不等于长期稳定性或断电保证。"
    }
  ],
