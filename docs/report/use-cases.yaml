  "use_cases": [
    {
      "id": "UC-01",
      "name": "Start and configure service",
      "kind": "main",
      "priority": "高",
      "goal": "启动配置明确、错误可见的本地备份服务。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "KEYS"
      ],
      "trigger": "执行 bak server start -d <目录>，或增加 --foreground 前台运行。",
      "preconditions": [
        "已有工作目录和 config.json。"
      ],
      "success": "服务监听配置地址，持久化作业库与 worker 就绪。",
      "failure": "返回可诊断错误或持久化失败作业；不声明操作成功。",
      "includes": [],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-01",
        "FR-07",
        "FR-12"
      ],
      "nfr": [
        "NFR-03",
        "NFR-05",
        "NFR-07"
      ],
      "business_rules": [],
      "notes": "根命令只接受子命令。WebUI 独立于二进制部署，enabled=true 时必须用 path 指定静态资源目录；修改资源无需重编译。作业库 schema v5、自包含备份格式 v9；旧仓库保留并由旧版读取。后台实例通过用户级 Unix socket 管理，日志追加至工作目录 server.log。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "准备 config.json，执行 bak server start -d <目录>；命令等待后台进程初始化和对账完成后返回 PID、地址与日志路径。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "解析参数、读取配置并加载全部命名密钥；无效密钥使启动失败。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "打开 jobs.sqlite3，对账中断备份；完整且可验证的输出补记成功，其他中断作业失败且不重放。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "绑定监听地址，启动认证 API、可选静态 UI 和 FIFO worker。"
        }
      ],
      "alternative_flows": [
        {
          "id": "A1",
          "from": "B1",
          "condition": "由终端或进程监督器管理前台服务",
          "steps": [
            "执行 bak server start --foreground -d <目录>，通过 Ctrl-C 或 SIGTERM 停止；前台实例不纳入用户级后台 status/stop。"
          ]
        }
      ],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "参数或配置无效",
          "steps": [
            "输出错误并非零退出；不启动服务。"
          ]
        },
        {
          "id": "E2",
          "from": "B3-B4",
          "condition": "数据库不可用或端口占用",
          "steps": [
            "输出启动失败原因并非零退出。"
          ]
        }
      ]
    },
    {
      "id": "UC-02",
      "name": "Query authenticated status",
      "kind": "main",
      "priority": "高",
      "goal": "确认目标服务可连接，读取版本和可用加密密钥标识/指纹。",
      "primary_actor": "CLIENT",
      "supporting_actors": [],
      "trigger": "GET /api/status。",
      "preconditions": [
        "服务已启动。"
      ],
      "success": "HTTP 200 返回 version 与 encryption_keys，不返回密钥内容。",
      "failure": "返回可诊断错误或持久化失败作业；不声明操作成功。",
      "includes": [],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-02"
      ],
      "nfr": [
        "NFR-03",
        "NFR-06"
      ],
      "business_rules": [],
      "notes": "GET / 根据 web_ui.enabled 返回公开控制台或运行提示；状态不代表特定作业成功。GET 路由支持 HEAD，CORS 预检不要求认证。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "客户端携带 Bearer key 查询状态。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "系统校验 API 认证信息。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "返回当前版本及命名加密密钥标识与指纹列表。"
        }
      ],
      "alternative_flows": [],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "key 缺失或不匹配",
          "steps": [
            "返回 401、WWW-Authenticate: Bearer 与 JSON 错误。"
          ]
        },
        {
          "id": "E2",
          "from": "B1",
          "condition": "服务不可连接",
          "steps": [
            "客户端报告连接失败，不推断服务状态。"
          ]
        }
      ]
    },
    {
      "id": "UC-03",
      "name": "Create full backup",
      "kind": "main",
      "priority": "高",
      "goal": "按选定筛选与编码设置创建可恢复的全量备份。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "SRC",
        "TGT"
      ],
      "trigger": "POST /api/backups，或已校验的定时计划提交备份任务。",
      "preconditions": [
        "手动请求要求有效 Bearer key；已有源和仓库目录，规范化路径不重叠。"
      ],
      "success": "同步自包含临时归档，以不可覆盖的硬链接发布正式 .bak 并同步目录，然后保存任务成功结果；backup_id 使用持久化任务 ID。",
      "failure": "返回可诊断错误或持久化失败作业；不声明操作成功。",
      "includes": [
        "UC-06"
      ],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-03",
        "FR-06",
        "FR-09",
        "FR-10",
        "FR-11",
        "FR-12"
      ],
      "nfr": [
        "NFR-01",
        "NFR-02",
        "NFR-03",
        "NFR-04",
        "NFR-05"
      ],
      "business_rules": [
        "备份编号不可覆盖；本版本仅全量备份。",
        "备份期间保持源文件不变；复制时检测文件缩小或增长，但不提供跨文件一致性快照。",
        "正则字段 AND、包含规则 OR、排除优先；时间 from 含、before 不含。目录拒绝后不遍历或计数其后代。",
        "Zstd 默认等级 3；LZ77 默认窗口 64 KiB、搜索上限 32。加密保护归档流，容器外层元数据仍明文；统计保存在文件中，暂不出现在任务结果内。"
      ],
      "notes": "筛选适用于文件、目录和符号链接；源根本身不参与筛选。正则编译和时间区间校验在 worker 执行时发生，HTTP 202 后仍可能失败。 LZ77 为自实现哈希候选链和滑动窗口格式，非 DEFLATE/ZIP/LZ4。界面默认 Zstd，API 显式选择算法；旧布尔压缩请求不再接受。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "提交 source、repository、完整 filter，可选的带 algorithm 标签的 compression 对象和 encryption 对象（algorithm、key_id）；null/省略 compression 表示不压缩。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "校验请求、等级和命名密钥，固定密钥指纹，持久化 queued 并返回 202/Location。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "worker FIFO 领取作业；验证路径、仓库版本及密钥指纹，编译筛选规则。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "读取 Unix 元数据并严格目录剪枝；记录支持条目与跳过统计。"
        },
        {
          "id": "B5",
          "actor": "系统",
          "action": "向唯一隐藏 .partial 写入条目头和数据，依次按需压缩、加密；追加 manifest、长度、结束标记及摘要，SHA-256 覆盖除摘要自身外的全部容器字节。"
        },
        {
          "id": "B6",
          "actor": "系统",
          "action": "完成编码与最终认证块，同步临时文件，硬链接发布 <backup_id>.bak 并同步目录，移除本次临时链接后再次同步。"
        },
        {
          "id": "B7",
          "actor": "系统",
          "action": "持久化成功结果，客户端在任务记录中查询并可跳转仓库。"
        }
      ],
      "alternative_flows": [],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "请求结构、压缩等级或密钥标识无效",
          "steps": [
            "返回 400；请求不入队。"
          ]
        },
        {
          "id": "E2",
          "from": "B3-B6",
          "condition": "路径/格式错误、规则无效、密钥变化或 IO/提交失败",
          "steps": [
            "作业失败并记录原因；无效规则和密钥在创建载荷前失败。",
            "普通失败清理本次拥有的临时输出；崩溃遗留在下次启动对账，文件发布与任务结果提交不共享事务。"
          ]
        }
      ]
    },
    {
      "id": "UC-04",
      "name": "List published backups",
      "kind": "main",
      "priority": "高",
      "goal": "获取仓库中已经发布的备份摘要。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "TGT"
      ],
      "trigger": "GET /api/backups?repository=PATH。",
      "preconditions": [
        "有效 Bearer key；仓库目录存在。"
