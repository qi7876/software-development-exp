    {
      "id": "UC-03",
      "name": "Create full backup",
      "kind": "main",
      "priority": "高",
      "goal": "按选定筛选与编码设置创建可恢复的全量备份。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "SRC",
        "TGT"
      ],
      "trigger": "POST /api/backups。",
      "preconditions": [
        "有效 Bearer key；已有源和仓库目录，规范化路径不重叠。"
      ],
      "success": "同步载荷后原子发布头、条目、根元数据和统计；成功作业仅返回 backup_id。",
      "failure": "返回可诊断错误或持久化失败作业；不声明操作成功。",
      "includes": [
        "UC-06"
      ],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-03",
        "FR-06",
        "FR-09",
        "FR-10",
        "FR-11",
        "FR-12"
      ],
      "nfr": [
        "NFR-01",
        "NFR-02",
        "NFR-03",
        "NFR-04",
        "NFR-05"
      ],
      "business_rules": [
        "备份编号不可覆盖；本版本仅全量备份。",
        "备份期间需保持源文件不变，程序不检测并发源修改。",
        "正则字段 AND、包含规则 OR、排除优先；时间 from 含、before 不含。目录拒绝后不遍历或计数其后代。",
        "Zstd 等级默认 3；LZ77 默认窗口 64 KiB、搜索上限 32，只影响备份编码；加密只保护文件内容。统计目前不出现在作业结果中。"
      ],
      "notes": "筛选适用于文件、目录和符号链接；源根本身不参与筛选。正则编译和时间区间校验在 worker 执行时发生，HTTP 202 后仍可能失败。 LZ77 为自实现哈希候选链和滑动窗口格式，非 DEFLATE/ZIP/LZ4。界面默认 Zstd，API 显式选择算法；旧布尔压缩请求不再接受。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "提交 source、repository、完整 filter，可选的带 algorithm 标签的 compression 对象和 encryption_key_id；null/省略 compression 表示不压缩。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "校验请求、等级和命名密钥，固定密钥指纹，持久化 queued 并返回 202/Location。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "worker FIFO 领取作业；验证路径、仓库版本及密钥指纹，编译筛选规则。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "读取 Unix 元数据并严格目录剪枝；记录支持条目与跳过统计。"
        },
        {
          "id": "B5",
          "actor": "系统",
          "action": "流式计算原文大小与哈希，对普通文件选择无压缩、Zstd 或 LZ77，再按需加密；不缓存整个文件。"
        },
        {
          "id": "B6",
          "actor": "系统",
          "action": "完成压缩与最终认证块，依次同步文件和目录，事务发布仓库元数据。"
        },
        {
          "id": "B7",
          "actor": "系统",
          "action": "持久化成功结果，客户端在任务记录中查询并可跳转仓库。"
        }
      ],
      "alternative_flows": [],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "请求结构、压缩等级或密钥标识无效",
          "steps": [
            "返回 400；请求不入队。"
          ]
        },
        {
          "id": "E2",
          "from": "B3-B6",
          "condition": "路径/格式错误、规则无效、密钥变化或 IO/提交失败",
          "steps": [
            "作业失败并记录原因；无效规则和密钥在创建载荷前失败。",
            "不发布未提交元数据；运行中失败可留下未发布目录。"
          ]
        }
      ]
    },
