  "use_cases": [
    {
      "id": "UC-01",
      "name": "Start and configure service",
      "kind": "main",
      "priority": "高",
      "goal": "启动配置明确、错误可见的本地备份服务。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "KEYS"
      ],
      "trigger": "执行 bak server start -d <目录>，或增加 --foreground 前台运行。",
      "preconditions": [
        "已有工作目录和 config.json。"
      ],
      "success": "服务监听配置地址，持久化作业库与 worker 就绪。",
      "failure": "返回诊断错误，作业执行失败时持久化失败状态。",
      "includes": [],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-01",
        "FR-07",
        "FR-12"
      ],
      "nfr": [
        "NFR-03",
        "NFR-05",
        "NFR-07"
      ],
      "business_rules": [],
      "notes": "启用控制台时用 web_ui.path 指定静态资源目录，服务在请求时读取资源。作业库使用 schema v5，归档使用 v10。后台实例通过当前用户的 Unix socket 管理，日志追加至工作目录的 server.log。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "准备 config.json，执行 bak server start -d <目录>；命令等待后台进程初始化和对账完成后返回 PID、地址与日志路径。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "解析参数、读取配置并加载全部命名密钥；无效密钥使启动失败。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "打开 jobs.sqlite3，对账中断备份；完整且可验证的输出补记成功，其余中断作业记录失败。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "校验计划并初始化调度游标，再绑定监听地址，启动认证 API、可选静态 UI、FIFO worker 和调度器。"
        }
      ],
      "alternative_flows": [
        {
          "id": "A1",
          "from": "B1",
          "condition": "由终端或进程监督器管理前台服务",
          "steps": [
            "执行 bak server start --foreground -d <目录>，通过 Ctrl-C 或 SIGTERM 停止；后台 status/stop 面向当前用户的后台实例。"
          ]
        }
      ],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "参数或配置无效",
          "steps": [
            "输出配置错误并以非零状态退出。"
          ]
        },
        {
          "id": "E2",
          "from": "B3-B4",
          "condition": "数据库不可用或端口占用",
          "steps": [
            "输出启动失败原因，以非零状态退出。"
          ]
        }
      ]
    },
