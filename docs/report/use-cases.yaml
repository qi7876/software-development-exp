      "notes": "恢复只需 repository、backup_id、destination；编码模式与密钥从元数据自动选择。界面缺少匹配密钥时禁用恢复，服务端执行仍独立校验。 LZ77 验证自定义头部、窗口、回引用、结束标记和尾随数据；完整压缩配置纳入加密载荷 v2 的认证数据。",
