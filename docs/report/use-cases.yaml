{
  "version": "6.1",
  "updated": "2026-11-20",
  "author": "项目开发者",
  "system": "bak Local Backup Service",
  "functional_requirements": [
    {
      "id": "FR-01",
      "name": "服务启动与配置",
      "description": "CLI 提供帮助、版本、密钥生成和 Bash、Fish、Zsh 补全。server start -d 启动后台服务，--foreground 前台运行，status 和 stop 管理当前用户的后台实例。服务启动时加载配置、密钥和作业库，并对账中断任务。"
    },
    {
      "id": "FR-02",
      "name": "认证与状态",
      "description": "Bearer key 保护 API；状态返回版本和加密密钥标识/指纹。公开静态控制台可连接远程 API，CORS 预检先于 Bearer 认证。"
    },
    {
      "id": "FR-03",
      "name": "全量备份",
      "description": "全量备份普通文件、目录、符号链接、FIFO、字符设备和块设备，保留 Unix 元数据与硬链接关系。Unix 套接字跳过并计数。每个 .bak 保存编码参数、条目、统计和末尾 SHA-256 摘要。"
    },
    {
      "id": "FR-04",
      "name": "备份列表",
      "description": "扫描正式 .bak 的元数据，按时间降序、同时间编号升序返回摘要。正式归档校验失败时报告错误。"
    },
    {
      "id": "FR-05",
      "name": "恢复与校验",
      "description": "先校验条目路径，再恢复到独立的已有空目录。服务自动解密、解压，校验最终认证块、文件大小和容器 SHA-256，并还原条目类型、硬链接关系和 Unix 元数据。"
    },
    {
      "id": "FR-06",
      "name": "持久化作业与历史",
      "description": "请求先入库再返回 202/Location；单 worker FIFO 执行，查询与游标分页展示请求、状态、结果和时间。自动触发和立即执行的计划均保存 schedule_id 与 scheduled_for。"
    },
    {
      "id": "FR-07",
      "name": "关闭与重启恢复",
      "description": "正常关闭等待活动作业完成、保留 queued；重启校验中断备份并对账，完整输出补记成功，其余中断任务记录失败。继续 queued 并保留终态历史。"
    },
    {
      "id": "FR-08",
      "name": "浏览器控制台与连接管理",
      "description": "静态控制台提供创建备份、仓库恢复、定时计划、任务记录及连接管理。发行包的资源位于 web-ui/，服务按 web_ui.path 读取。浏览器验证新连接后切换服务并清空旧服务数据。"
    },
    {
      "id": "FR-09",
      "name": "文件类型、路径与元数据筛选",
      "description": "按文件类型、相对路径、UID/GID、八进制权限及访问和修改时间筛选。目录未通过路径或元数据规则时剪除该子树。取消目录类型后仍保留已选条目的父目录。"
    },
    {
      "id": "FR-10",
      "name": "Unix 元数据与统计",
      "description": "归档保存源根及条目的 UID/GID、权限和纳秒时间戳，以及链接目标、设备号和备份统计。同步临时文件后，以独占硬链接发布并同步目录。"
    },
    {
      "id": "FR-11",
      "name": "可选压缩与内容加密",
      "description": "压缩可选关闭、Zstd 或流式 LZ77。加密可选关闭、XChaCha20-Poly1305 或 AES-256-GCM。两项独立设置，先压缩后加密。恢复按归档记录选择算法与密钥。"
    },
    {
      "id": "FR-12",
      "name": "命名密钥生成与使用",
      "description": "keygen 独占创建随机 256 位密钥文件。服务在启动时加载命名密钥，作业和归档通过密钥 ID 与指纹选择原密钥。"
    },
    {
      "id": "FR-13",
      "name": "配置式定时备份",
      "description": "配置 IANA 时区与五字段 Cron；控制台或认证 API 可查看启用/停用计划，并按保存配置立即入队。自动触发和立即执行共享活动计划约束，Cron 游标由自动调度推进。编辑配置后重启服务。"
    }
  ],
  "nonfunctional_requirements": [
    {
      "id": "NFR-01",
      "name": "数据正确性",
      "description": "恢复保留相对路径、条目类型、内容和受支持的 Unix 元数据。备份读取源文件并发布新归档，恢复读取已发布归档并写入目标目录。"
    },
    {
      "id": "NFR-02",
      "name": "流式处理",
      "description": "编解码、认证和校验使用有界缓冲。遍历结果和元数据列表的大小随条目数增长。"
    },
    {
      "id": "NFR-03",
      "name": "可观测性",
      "description": "输入、数据库与作业执行失败有明确错误；worker 或结果持久化失败导致服务失败退出。"
    },
    {
      "id": "NFR-04",
      "name": "响应性",
      "description": "阻塞文件操作在 Tokio blocking task 中运行，状态和作业查询保持可用；性能基线通过实测记录。"
    },
    {
      "id": "NFR-05",
      "name": "持久化机制",
      "description": "作业 SQLite 使用 WAL、FULL 同步和事务；文件发布与作业终态提交独立，通过幂等启动对账修复中断备份；单工作目录持有独占实例锁。"
    },
    {
      "id": "NFR-06",
      "name": "安全机制",
      "description": "API key 与加密密钥分离；AEAD 保护归档流并绑定编码参数，容器外层元数据明文保存并纳入 SHA-256 校验。浏览器 API key 存入 localStorage，服务通过 HTTP 提供 API。"
    },
    {
      "id": "NFR-07",
      "name": "运行平台",
      "description": "备份和恢复支持 Linux 和 macOS，发行包与 Rust CI 覆盖 Linux x86_64 和 macOS ARM64。"
    }
  ],
