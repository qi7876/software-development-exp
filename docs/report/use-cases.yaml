{
  "version": "4.0",
  "updated": "2026-10-31",
  "author": "项目开发者",
  "system": "bak Local Backup Service",
  "functional_requirements": [
    {
      "id": "FR-01",
      "name": "服务启动与配置",
      "description": "读取工作目录 config.json，支持帮助、版本和工作目录参数；加载可选 Web UI 配置、命名加密密钥及作业库，错误可见。"
    },
    {
      "id": "FR-02",
      "name": "认证与状态",
      "description": "Bearer key 保护 API；状态返回版本和加密密钥标识/指纹。公开静态控制台可连接远程 API，CORS 预检先于认证且不使用 cookie。"
    },
    {
      "id": "FR-03",
      "name": "全量备份",
      "description": "备份已有且与仓库不重叠的源目录；保存普通文件、空目录、Unix 元数据和符号链接目标，SHA-256 与原始大小描述原文。"
    },
    {
      "id": "FR-04",
      "name": "备份列表",
      "description": "仅列出已发布备份的编号、创建时间、压缩状态和加密密钥信息；时间降序、同时间编号升序，未建库目录返回空列表且不建库。"
    },
    {
      "id": "FR-05",
      "name": "恢复与校验",
      "description": "恢复到独立的已有空目录，预先校验全部条目路径；自动解密/解压，校验认证最终块、大小及 SHA-256，并恢复 Unix 元数据和符号链接。"
    },
    {
      "id": "FR-06",
      "name": "持久化作业与历史",
      "description": "请求先入库再返回 202/Location；单 worker FIFO 执行，单作业查询与游标分页历史显示请求、状态、结果、错误及执行时间。"
    },
    {
      "id": "FR-07",
      "name": "关闭与重启恢复",
      "description": "正常关闭等待活动作业完成、保留 queued；重启将中断 running 标为失败且不重放，继续 queued 并保留终态历史。"
    },
    {
      "id": "FR-08",
      "name": "浏览器控制台与连接管理",
      "description": "提供创建备份、仓库恢复、任务记录及连接管理；浏览器保存连接名称、地址、API key 与选中连接，验证成功才切换服务。"
    },
    {
      "id": "FR-09",
      "name": "路径与元数据筛选",
      "description": "相对路径、UID/GID、八进制权限的包含/排除正则与 atime/mtime 时间区间组合筛选；目录不匹配则剪除整个子树。"
    },
    {
      "id": "FR-10",
      "name": "Unix 元数据与统计",
      "description": "原子记录根和条目的 UID/GID、权限、纳秒时间戳及符号链接目标，记录创建、过滤跳过和不支持类型跳过的互斥计数。"
    },
    {
      "id": "FR-11",
      "name": "可选压缩与内容加密",
      "description": "压缩选择无、Zstd 或自实现流式 LZ77，并可独立加密，构成六种模式。Zstd 等级 1–22；LZ77 窗口 4–1024 KiB、搜索上限 1–256。同时启用固定先压缩后加密。"
    },
    {
      "id": "FR-12",
      "name": "命名密钥生成与使用",
      "description": "keygen 创建随机 256 位密钥文件且拒绝覆盖；启动加载命名密钥，任务与备份固定标识和指纹，密钥缺失或变化时明确失败。"
    }
  ],
  "nonfunctional_requirements": [
    {
      "id": "NFR-01",
      "name": "数据正确性",
      "description": "恢复后相对路径、条目类型、内容及支持的 Unix 元数据正确；不修改源和已有成功备份。"
    },
    {
      "id": "NFR-02",
      "name": "流式处理",
      "description": "文件编码、解码、认证和校验有界缓冲；遍历条目与元数据列表仍随条目数增长。"
    },
    {
      "id": "NFR-03",
      "name": "可观测性",
      "description": "输入、数据库与作业执行失败有明确错误；worker 或结果持久化失败导致服务失败退出。"
    },
    {
      "id": "NFR-04",
      "name": "响应性",
      "description": "阻塞文件操作在 Tokio blocking task 中运行，状态和作业查询保持可用；性能基线通过实测记录。"
    },
    {
      "id": "NFR-05",
      "name": "持久化边界",
      "description": "SQLite 使用 WAL、FULL 同步和事务；两个数据库与外部文件不共享事务，单工作目录只运行一个服务。"
    },
    {
      "id": "NFR-06",
      "name": "安全边界",
      "description": "API key 与加密密钥分离；加密只保护文件内容，文件名、大小、校验和、Unix 元数据及链接目标仍可见。浏览器 API key 以明文存入 localStorage；服务无内置 TLS。"
    },
    {
      "id": "NFR-07",
      "name": "平台与验证边界",
      "description": "当前备份和恢复执行支持 Unix，实测平台为 macOS；短时验证不等于长期稳定性或断电保证。"
    }
  ],
