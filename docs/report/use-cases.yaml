    {
      "id": "UC-03",
      "name": "Create full backup",
      "kind": "main",
      "priority": "高",
      "goal": "按选定筛选与编码设置创建可恢复的全量备份。",
      "primary_actor": "CLIENT",
      "supporting_actors": [
        "SRC",
        "TGT"
      ],
      "trigger": "POST /api/backups，或已校验的定时计划提交备份任务。",
      "preconditions": [
        "手动请求要求有效 Bearer key；已有源和仓库目录，规范化后的路径彼此独立。"
      ],
      "success": "同步自包含临时归档，以独占硬链接发布正式 .bak 并同步目录，然后保存任务成功结果；backup_id 使用持久化任务 ID。",
      "failure": "返回诊断错误，作业执行失败时持久化失败状态。",
      "includes": [
        "UC-06"
      ],
      "extension_points": [],
      "extends": null,
      "parent": null,
      "requirements": [
        "FR-03",
        "FR-06",
        "FR-09",
        "FR-10",
        "FR-11",
        "FR-12"
      ],
      "nfr": [
        "NFR-01",
        "NFR-02",
        "NFR-03",
        "NFR-04",
        "NFR-05"
      ],
      "business_rules": [
        "每次备份写入所选条目的完整内容，发布时独占创建备份文件。",
        "备份期间保持源文件稳定，复制时检测文件缩小或增长。",
        "正则字段取交集，包含规则取并集，排除规则优先。时间范围从 from 起算，到 before 前结束。",
        "Zstd 默认等级 3；LZ77 默认窗口 64 KiB、搜索上限 32。加密保护归档流，容器外层元数据与统计随归档明文保存。"
      ],
      "notes": "筛选从源根的子条目开始，硬链接各路径按原文件类型分别筛选。worker 在执行时编译正则并校验时间区间。控制台默认使用 Zstd，API 通过 compression 选择算法。",
      "basic_flow": [
        {
          "id": "B1",
          "actor": "CLIENT",
          "action": "提交 source、repository、完整 filter，可选的带 algorithm 标签的 compression 对象和 encryption 对象（algorithm、key_id）；null/省略 compression 表示不压缩。"
        },
        {
          "id": "B2",
          "actor": "系统",
          "action": "校验请求、等级和命名密钥，固定密钥指纹，持久化 queued 并返回 202/Location。"
        },
        {
          "id": "B3",
          "actor": "系统",
          "action": "worker 按 FIFO 领取作业，核对密钥指纹，确认源与仓库是互不重叠的已有目录，再编译筛选规则。"
        },
        {
          "id": "B4",
          "actor": "系统",
          "action": "读取 Unix 元数据并严格目录剪枝；记录支持条目与跳过统计。"
        },
        {
          "id": "B5",
          "actor": "系统",
          "action": "向唯一隐藏 .partial 写入条目头和数据，依次按需压缩、加密。写完归档流结束标记后，结束压缩与加密编码。"
        },
        {
          "id": "B6",
          "actor": "系统",
          "action": "追加明文 manifest、长度、容器尾标记与 SHA-256 摘要。同步临时文件，硬链接发布 <backup_id>.bak 并同步目录，移除临时链接后再次同步。"
        },
        {
          "id": "B7",
          "actor": "系统",
          "action": "持久化成功结果，客户端在任务记录中查询并可跳转仓库。"
        }
      ],
      "alternative_flows": [],
      "exception_flows": [
        {
          "id": "E1",
          "from": "B2",
          "condition": "请求结构、压缩等级或密钥标识无效",
          "steps": [
            "请求校验返回 400。"
          ]
        },
        {
          "id": "E2",
          "from": "B3-B6",
          "condition": "路径、筛选规则或密钥校验失败，或写入及发布归档失败",
          "steps": [
            "作业失败并记录原因；无效规则和密钥在创建载荷前失败。",
            "作业失败时清理本次临时输出，异常退出留下的文件由启动对账处理。文件发布和 SQLite 记账各自提交。"
          ]
        }
      ]
    },
